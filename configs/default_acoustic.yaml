project:
  title: "VSLP"
  mode: "research_use_only"
  privacy: "local_only"

ingest:
  accepted_extensions: [".wav", ".mp3", ".mp4", ".m4a", ".ogg", ".flac", ".aac", ".aiff", ".webm", ".mov"]
  preserve_originals: true
  duplicate_policy: ".wav > .mp4 > .webm > other supported extensions for identical filename stems"

preprocess:
  input_contract: "accepted_ingest_records_only"
  canonical_audio_format: "wav_float32"
  preserve_native_sample_rate: true
  output_channels: 1
  remove_dc_offset_default: true
  peak_normalization: false
  generic_filtering: false
  quality_classification: false
  model_specific_resampling: false
  channel_resolution:
    policy: "conservative_no_silent_downmix"
    duplicate_correlation_min: 0.999
    duplicate_gain_difference_db_max: 0.10
    silent_channel_rms_max: 1.0e-6
    ambiguous_multichannel: "withhold_and_require_review"

segmentation:
  method: "silero_vad"
  available_methods: ["silero_vad", "energy_rms", "custom_plugin"]
  silero_vad:
    input_sample_rate_hz: 16000
    resampling_scope: "in_memory_model_specific"
    threshold: 0.5
    min_speech_duration_ms: 250
    min_silence_duration_ms: 100
    speech_pad_ms: 50
    return_seconds: false
    frame_ms: 30
  energy_rms:
    frame_ms: 30
    hop_ms: 10
    threshold_db: null

features:
  default_selection: "all"
  subsystems:
    - respiratory_timing
    - phonatory
    - articulatory
    - resonatory
    - rhythm
    - coordination
  bamboo_word_count: 99

aggregation:
  level: "file_task"
  missing_policy: "retain_nan_and_report"
  export_csv: true
  export_parquet: true
