# One-time batch alignment: which recordings go through MFA, and with which
# registered prompt. Keys are the task code in the file name, i.e. the part
# after the date: SUBJECT_PROTOCOL_ITERATION_YYYYMMDD_<CODE>.wav
#
# repetitions = how many times the prompt is said in ONE recording. MFA aligns
# exactly this many copies of the text; a recording with fewer/more is flagged
# for review and left out of the package (never forced).
# count_readings: true = the count comes from each recording (speech-to-text
# reading count), and the value here is only the usual protocol count.
version: vslp_batch_alignment_tasks_v1

tasks:
  240_PSG_BAMBOO:   {task_id: bamboo_passage,      repetitions: 1}
  # Sentence tasks: the number of readings varies by protocol and speaker
  # (1075 reads each sentence 3x; BBP_NORMAL 3 to ~8x), so it is counted per
  # recording (readings.py) and never assumed.
  1052_SENT_JUDGE:  {task_id: sentence_s7,         repetitions: 3, count_readings: true}
  1061_CAPEV_3:     {task_id: sentence_s5,         repetitions: 3, count_readings: true}
  1063_CAPEV_4:     {task_id: sentence_s6,         repetitions: 3, count_readings: true}
  1064_CAPEV_2:     {task_id: sentence_capev_hit,  repetitions: 3, count_readings: true}
  256_NSM_NAS_WSTG: {task_id: wstg,                repetitions: 3, count_readings: true}
  238_BBP_NORMAL:   {task_id: sentence_s2,         repetitions: 3, count_readings: true}
  1048_BBP_SHORT:   {task_id: sentence_s2,         repetitions: 3, count_readings: true}
  # 258_SENT_CAPEV (six different sentences in one file) is first cut into one
  # WAV per sentence by capev_split.py; those files end in these codes.
  258_SENT_CAPEV_S3:   {task_id: sentence_s3,         repetitions: 1, count_readings: true}
  258_SENT_CAPEV_HIT:  {task_id: sentence_capev_hit,  repetitions: 1, count_readings: true}
  258_SENT_CAPEV_S5:   {task_id: sentence_s5,         repetitions: 1, count_readings: true}
  258_SENT_CAPEV_EGGS: {task_id: sentence_capev_eggs, repetitions: 1, count_readings: true}
  258_SENT_CAPEV_S6:   {task_id: sentence_s6,         repetitions: 1, count_readings: true}
  258_SENT_CAPEV_S9:   {task_id: sentence_s9,         repetitions: 1, count_readings: true}

# Content not known per recording: identified first (speech-to-text, then
# closest match among known sentences), aligned afterwards. Not run by the
# fixed-prompt batch.
identify_first:
  258_SENT_CAPEV: {candidates: [sentence_s3, sentence_capev_hit, sentence_s5,
                                sentence_capev_eggs, sentence_s6, sentence_s9]}
  1059_SIT: {candidates: sit_sentence_pool_required}

# Deliberately never aligned with MFA (handled by GUI segmentation methods).
not_aligned: [242_DDK_PA, 260_DDK_TA, 261_DDK_KA, 262_DDK_PATAKA,
              241_VWL_SUSTAIN, 1050_VWL_SUSTAIN_2, 1102_MAX_PHON]
