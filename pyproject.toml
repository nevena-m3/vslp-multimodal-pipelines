[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vslp-multimodal-pipelines"
version = "0.21.0"
description = "Local-first, reproducible acoustic and kinematic research pipelines for clinical speech and facial movement analysis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Research Use Only - license pending"}
authors = [{name = "VSLP Team"}]
keywords = ["speech", "acoustics", "kinematics", "ALS", "clinical research", "machine learning"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "soundfile>=0.12",
  "matplotlib>=3.8",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "jinja2>=3.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.7",
  "pyqtgraph>=0.13",
]
silero = [
  "torch>=2.2",
  "torchaudio>=2.2",
]
kinematic = [
  "opencv-python>=4.9",
  "mediapipe>=0.10",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.8",
]
all = [
  "vslp-multimodal-pipelines[gui,silero,kinematic,dev]",
]

[project.scripts]
vslp = "vslp.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vslp"]

[tool.ruff]
line-length = 100
target-version = "0.21.0"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
